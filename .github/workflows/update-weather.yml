name: Refresh city weather
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_weather.py, .github/workflows/update-weather.yml]
permissions:
  contents: write
concurrency:
  group: weather-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_weather.py
      - name: Publish forecasts when changed
        run: |
          git config user.name "isla-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          if ! git diff --cached --quiet; then
            git commit -m "Update city weather forecasts"
            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase origin main; then
                echo "Weather update cannot be safely rebased"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published fresh weather on attempt $attempt"
                exit 0
              fi
              echo "Concurrent repository update; retrying $attempt/5"
              sleep 2
            done
            echo "Weather publish failed after five retries"
            exit 1
          fi
