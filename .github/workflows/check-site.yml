name: Check site and automation code
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*/*.html"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - "scripts/**"
      - "tests/**"
      - "data/local_context.json"
      - ".github/workflows/check-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile updater scripts
        run: python -m py_compile scripts/update_news.py scripts/update_weather.py scripts/news_quality.py scripts/update_roadworks.py scripts/update_local_notices.py tests/test_news_quality.py tests/test_roadworks.py tests/test_transport_fuel.py
      - name: Test news classification, duplicate removal and geographic relevance
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify candidate RSS parser rejects HTML (offline)
        run: python scripts/probe-regional-rss.py --selftest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared website JavaScript and cached data
        run: |
          node --check assets/home-app.js
          node --check scripts/verify-production.mjs
          node scripts/build-homepages.mjs --check
          node scripts/check-home-runtime.mjs
          python - <<'PY'
          import pathlib,json
          for file in ("data/news.json","data/weather.json","data/roadworks.json","data/local_notices.json","data/local_context.json","data/fuel_prices.json"):
              json.loads(pathlib.Path(file).read_text(encoding="utf-8"))
          PY
      - name: Validate US-only weather unit region endpoint and partner links
        run: |
          node --input-type=module --check < functions/api/visitor-country.js
          python - <<'PY'
          import json,pathlib
          page=pathlib.Path('index.html').read_text(encoding='utf-8')
          shared=pathlib.Path('assets/home-app.js').read_text(encoding='utf-8')
          routes=json.loads(pathlib.Path('_routes.json').read_text(encoding='utf-8'))
          assert routes['include']==['/api/visitor-country']
          assert 'visitorCountry===\'US\'' in shared
          assert 'https://vuelosrd.pages.dev/' in shared
          assert 'https://ahorrord.pages.dev/' in shared
          assert 'https://transporterd.pages.dev/' in shared
          assert 'https://edeeste.com.do/inicio/servicios/estado-de-circuito-y-suministro/' in shared
          PY
