name: Check site and automation code
on:
  push:
    branches: [main]
    paths:
      - index.html
      - "scripts/**"
      - ".github/workflows/check-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile updater scripts
        run: python -m py_compile scripts/update_news.py scripts/update_weather.py scripts/news_quality.py scripts/update_roadworks.py scripts/update_local_notices.py tests/test_news_quality.py tests/test_roadworks.py
      - name: Test news classification, duplicate removal and geographic relevance
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate website inline JavaScript and cached data
        run: |
          python - <<'PY'
          import pathlib, re, json
          html=pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          assert scripts, "Missing inline JS"
          pathlib.Path("/tmp/isla-site.js").write_text("\n".join(scripts),encoding="utf-8")
          for file in ("data/news.json","data/weather.json","data/roadworks.json","data/local_notices.json"):
              json.loads(pathlib.Path(file).read_text(encoding="utf-8"))
          PY
          node --check /tmp/isla-site.js
      - name: Validate US-only weather unit region endpoint and partner links
        run: |
          node --input-type=module --check < functions/api/visitor-country.js
          python - <<'PY'
          import json,pathlib
          page=pathlib.Path('index.html').read_text(encoding='utf-8')
          routes=json.loads(pathlib.Path('_routes.json').read_text(encoding='utf-8'))
          assert routes['include']==['/api/visitor-country']
          assert 'visitorCountry===\'US\'' in page
          assert 'https://comparanetrd.pages.dev/' in page
          assert 'https://by-maria-beauty-store.pages.dev/' in page
          assert 'https://github.com/PuntaCanada/recarganet-rd' in page
          assert 'https://edeeste.com.do/inicio/servicios/estado-de-circuito-y-suministro/' in page
          PY
