name: Check five-language guides
on:
  push:
    paths:
      - '*.html'
      - '*/*.html'
      - 'guide-i18n.js'
      - 'sitemap.xml'
      - 'scripts/check-guides.mjs'
      - 'scripts/check-localized-seo.mjs'
      - '.github/workflows/check-guides.yml'
  pull_request:
    paths:
      - '*.html'
      - '*/*.html'
      - 'guide-i18n.js'
      - 'sitemap.xml'
      - 'scripts/check-guides.mjs'
      - 'scripts/check-localized-seo.mjs'
      - '.github/workflows/check-guides.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all content guides are translated
        run: |
          node scripts/check-guides.mjs
          node scripts/check-localized-seo.mjs
