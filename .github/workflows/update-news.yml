name: Refresh RSS headlines
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_news.py
      - name: Publish changed metadata
        run: |
          git config user.name "isla-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then git commit -m "Refresh RSS headline metadata" && git push; fi
