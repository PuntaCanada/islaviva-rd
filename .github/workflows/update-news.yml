name: Refresh RSS headlines
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - "scripts/audit_news_categories.py"
      - "scripts/news_quality.py"
      - "scripts/update_roadworks.py"
      - "scripts/update_local_notices.py"
      - ".github/workflows/update-news.yml"
permissions:
  contents: write
concurrency:
  group: news-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and optionally translate headline metadata
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ vars.AZURE_TRANSLATOR_REGION }}
        run: python scripts/update_news.py
      - name: Audit current RSS categories and highlight possible mismatches
        run: python scripts/audit_news_categories.py
      - name: Build dated roadwork and closure notices
        run: python scripts/update_roadworks.py
      - name: Read recent utility and local events notices (optional)
        run: python scripts/update_local_notices.py
      - name: Publish updated metadata
        run: |
          git config user.name "isla-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/roadworks.json data/local_notices.json
          if [ -f data/translation_usage.json ]; then git add data/translation_usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh RSS headline metadata"
            # The website is edited frequently. Another push can land after
            # rebase and before publish; retry safely without force-pushing.
            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase origin main; then
                echo "Cannot safely rebase the RSS update; manual review required"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published RSS metadata on attempt $attempt"
                exit 0
              fi
              echo "Concurrent update during push ($attempt/5); retrying"
              sleep 2
            done
            echo "RSS publish could not complete after five safe retries"
            exit 1
          fi
