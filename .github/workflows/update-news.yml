name: Refresh RSS headlines
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"
permissions:
  contents: write
concurrency:
  group: news-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and optionally translate headline metadata
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ vars.AZURE_TRANSLATOR_REGION }}
        run: python scripts/update_news.py
      - name: Publish updated metadata
        run: |
          git config user.name "isla-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if [ -f data/translation_usage.json ]; then git add data/translation_usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh RSS headline metadata"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
