name: Daily excursion geodata audit
on:
  schedule:
    - cron: '17 10 * * *'
  pull_request:
    paths:
      - 'data/excursions.json'
      - 'scripts/audit-excursion-geodata.mjs'
      - '.github/workflows/audit-excursion-geodata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-excursion-geodata.mjs
