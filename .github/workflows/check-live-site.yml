name: Smoke-test public IslaViva RD website
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-live-site.mjs'
      - '.github/workflows/check-live-site.yml'
  schedule:
    - cron: '23 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: islaviva-live-smoke-test
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script syntax
        run: node --check scripts/check-live-site.mjs
      - name: Check deployed pages and live data
        run: node scripts/check-live-site.mjs
