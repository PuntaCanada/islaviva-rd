name: Sync localized homepages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-locales.json'
      - 'scripts/build-homepages.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: homepage-sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate all localized homepages
        run: node scripts/build-homepages.mjs
      - name: Commit changed generated pages
        run: |
          if ! git diff --quiet -- de/index.html en/index.html fr/index.html ht/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add de/index.html en/index.html fr/index.html ht/index.html
            git commit -m "chore(i18n): sync generated localized homepages"
            git push
          else
            echo "Localized homepages already match the Spanish source"
          fi
