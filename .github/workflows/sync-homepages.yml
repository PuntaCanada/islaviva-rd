name: Sync localized homepages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-locales.json'
      - 'scripts/build-homepages.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: homepage-sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and safely publish all localized homepages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-homepages.mjs
            if git diff --quiet -- de/index.html en/index.html fr/index.html ht/index.html; then
              echo "All localized homepages already up to date"
              exit 0
            fi
            git add de/index.html en/index.html fr/index.html ht/index.html
            git commit -m "chore(i18n): sync generated localized homepages"
            if git push origin HEAD:main; then
              echo "Published localized homepages on attempt $attempt"
              exit 0
            fi
            echo "Another commit arrived during synchronization; retry $attempt/6"
            sleep 2
          done
          echo "Could not safely synchronize after six attempts"
          exit 1
